<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fees - Edu Home Admin</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>
    <script src="js/security.js"></script>

    <div class="container mt-5">
        <div class="page-header d-flex justify-content-between align-items-center flex-wrap" style="gap: 12px; margin-bottom: 20px;">
            <h2><a href="index.html" class="text-dark"><i class="fas fa-arrow-left"></i></a> Fee Management</h2>
            <div class="d-flex align-items-center flex-wrap" style="gap: 10px;">
                <button id="pullCloudBtn" class="btn btn-sm btn-outline-primary shadow-sm" style="padding: 8px 14px; font-weight: 600; border-radius: 20px;" onclick="runPullFromCloud()">
                    <i class="fas fa-cloud-download-alt mr-1"></i> Pull
                </button>
                <button id="pushCloudBtn" class="btn btn-sm btn-outline-success shadow-sm" style="padding: 8px 14px; font-weight: 600; border-radius: 20px;" onclick="runPushToCloud()">
                    <i class="fas fa-cloud-upload-alt mr-1"></i> Push
                </button>
                <a href="fee_calculator.html" class="btn btn-primary" style="background: linear-gradient(45deg, #ff007f, #7928ca); border: none; font-weight: bold; padding: 8px 18px; border-radius: 30px; box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);"><i class="fas fa-calculator"></i> Gamified Fee Calculator</a>
            </div>
        </div>
        <div id="manualSyncStatus" class="mb-3 text-right" style="min-height: 22px;"></div>

        <div class="row mb-4">
            <div class="col-md-5">
                <select class="form-control" id="feesClassSelect">
                    <option value="">Select Class to View</option>
                    <option value="6">Class 6</option>
                    <option value="7">Class 7</option>
                    <option value="8">Class 8</option>
                    <option value="9">Class 9</option>
                    <option value="10">Class 10</option>
                    <option value="11">Class 11</option>
                    <option value="12">Class 12</option>
                </select>
            </div>
            <div class="col-md-3">
                <select class="form-control" id="feeMonthSelect">
                    <option value="January">January</option>
                    <option value="February">February</option>
                    <option value="March">March</option>
                    <option value="April">April</option>
                    <option value="May">May</option>
                    <option value="June">June</option>
                    <option value="July">July</option>
                    <option value="August">August</option>
                    <option value="September">September</option>
                    <option value="October">October</option>
                    <option value="November">November</option>
                    <option value="December">December</option>
                </select>
            </div>
            <div class="col-md-4 text-right">
                <h4 id="displayMonth"></h4>
            </div>
        </div>

        <div class="card">
            <div class="col-md-12">
                <div class="table-responsive">
                    <table class="table table-bordered table-striped" id="feeTable">
                        <thead class="thead-dark">
                            <tr>
                                <th>Name</th>
                                <th>Phone</th>
                                <th>Fee Status</th>
                            </tr>
                        </thead>
                        <tbody id="feeTableBody">
                            <tr>
                                <td colspan="3" class="text-center">Select Class to view student fees.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Google Sheets Cloud Sync -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/sheets-client.js"></script>
    <script src="js/admin.js"></script>

    <script>
    // ── Cloud Sync Handlers for Fees Page ─────────────────────────────

    // Auto-pull on load to keep fee records fresh across devices
    document.addEventListener('DOMContentLoaded', function() {
        if (typeof sb_loadFromCloud === 'function') {
            sb_loadFromCloud().then(function(result) {
                if (result && result.ok) {
                    if (typeof window.loadFeeTable === 'function') {
                        window.loadFeeTable();
                    }
                }
            });
        }
    });

    async function runPullFromCloud() {
        const btn    = document.getElementById('pullCloudBtn');
        const status = document.getElementById('manualSyncStatus');

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Pulling...';
        status.innerHTML = '<span class="text-muted"><i class="fas fa-cloud-download-alt mr-1"></i>Downloading latest fees from cloud...</span>';

        const result = await sb_loadFromCloud();

        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-cloud-download-alt mr-1"></i> Pull';

        if (result && result.ok) {
            status.innerHTML = '<span class="text-success" style="font-size:0.85rem;"><i class="fas fa-check-circle mr-1"></i>Successfully pulled latest fees and ' + result.students.length + ' students from cloud!</span>';
            if (typeof window.loadFeeTable === 'function') {
                window.loadFeeTable();
            }
            setTimeout(() => { status.innerHTML = ''; }, 4000);
        } else {
            status.innerHTML = '<span class="text-danger" style="font-size:0.85rem;"><i class="fas fa-exclamation-triangle mr-1"></i>Pull failed: ' + (result ? result.msg : 'Network error') + '</span>';
        }
    }

    async function runPushToCloud() {
        const btn    = document.getElementById('pushCloudBtn');
        const status = document.getElementById('manualSyncStatus');

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Pushing...';
        status.innerHTML = '<span class="text-muted"><i class="fas fa-cloud-upload-alt mr-1"></i>Uploading local fees and students to cloud...</span>';

        const result = await sb_migrateFromLocalStorage();

        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-cloud-upload-alt mr-1"></i> Push';

        if (result && result.ok) {
            status.innerHTML = '<span class="text-success" style="font-size:0.85rem;"><i class="fas fa-check-circle mr-1"></i>Successfully pushed all local data to cloud!</span>';
            setTimeout(() => { status.innerHTML = ''; }, 4000);
        } else {
            status.innerHTML = '<span class="text-danger" style="font-size:0.85rem;"><i class="fas fa-exclamation-triangle mr-1"></i>Push failed: ' + (result ? result.msg : 'Network error') + '</span>';
        }
    }
    </script>
</body>

</html>
